name: Deploy Krit Wiki site (Quartz)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Clone Quartz (pinned)
        run: git clone --depth 1 --branch v4.5.2 https://github.com/jackyzha0/quartz.git quartz

      - name: Apply site config
        run: |
          cp site/quartz.config.ts quartz/quartz.config.ts
          cp site/quartz.layout.ts quartz/quartz.layout.ts
          cp site/custom.scss quartz/quartz/styles/custom.scss

      - name: Transform vault content → Quartz content
        run: node site/transform.mjs quartz/content

      - name: Install dependencies
        working-directory: quartz
        run: npm ci

      - name: Build
        working-directory: quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
