name: Deploy Krit Wiki site (Quartz)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Clone Quartz (pinned)
        run: git clone --depth 1 --branch v4.5.2 https://github.com/jackyzha0/quartz.git quartz

      - name: Apply site config
        run: |
          cp site/quartz.config.ts quartz/quartz.config.ts
          cp site/quartz.layout.ts quartz/quartz.layout.ts
          cp site/custom.scss quartz/quartz/styles/custom.scss

      - name: Transform vault content → Quartz content
        run: node site/transform.mjs quartz/content

      - name: Install dependencies
        working-directory: quartz
        run: npm ci

      - name: Build
        working-directory: quartz
        run: npx quartz build

      - name: Add .nojekyll (disable Jekyll processing)
        run: touch quartz/public/.nojekyll

      - name: Publish to gh-pages branch
        run: |
          cd quartz/public
          git init -b gh-pages
          git config user.name "krit-wiki-bot"
          git config user.email "krit-wiki-bot@users.noreply.github.com"
          git add -A
          git commit -q --allow-empty -m "deploy: ${{ github.sha }}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin gh-pages
